name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build dist (exclude large mp4)
        run: |
          node scripts/build-dist.mjs || (
            mkdir -p dist/data dist/media
            cp index.html app.js games.js play.js _headers _redirects dist/ 2>/dev/null || true
            cp -r data/* dist/data/ 2>/dev/null || true
            echo "ok" > dist/media/README.txt
          )
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
